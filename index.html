<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f1e7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="中文考试练习" />
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238c3b2e'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' fill='%23fffdf8' font-family='serif'%3E%E6%96%87%3C/text%3E%3C/svg%3E" />
<title>中文考试练习</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2f2a24; --sub:#7d7264;
  --accent:#8c3b2e; --accent-soft:#f0e2dc; --gold:#b98b4e;
  --ok:#2e7d4f; --ok-soft:#e6f2ea; --bad:#b3382c; --bad-soft:#f8e7e4;
  --line:#e5dbc9; --blank:#c9bda5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  line-height:1.7; font-size:16px;
  overscroll-behavior-y:contain;   /* 手机上避免下拉刷新打断答题 */
}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px;
  display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;   /* dvh 让手机地址栏收起/展开时高度不跳动 */
  padding-left:calc(16px + env(safe-area-inset-left));
  padding-right:calc(16px + env(safe-area-inset-right));}
.han{font-family:"Songti SC","STSong","SimSun","Source Han Serif SC",serif;}
/* 手机上按钮去掉 300ms 点击延迟、禁掉双击缩放 */
button,.mod,input,select{touch-action:manipulation}

/* 顶栏（手机上吸顶，返回键随时可点） */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 76%,rgba(246,241,231,.82));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  margin:0 -16px;padding-left:16px;padding-right:16px}
.top .title{font-size:18px;font-weight:700;letter-spacing:.5px;flex:1;min-width:0}
.top .title small{display:block;font-size:12px;font-weight:400;color:var(--sub);letter-spacing:0}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:6px 12px;font-size:14px;cursor:pointer}
.back:active{background:#f0ebe0}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 16px;box-shadow:0 2px 10px rgba(90,70,40,.05);margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px}
.card p.desc{margin:0;color:var(--sub);font-size:13.5px}

/* 首页模块 */
.mod{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;
  box-shadow:0 2px 10px rgba(90,70,40,.05);transition:transform .12s}
.mod:active{transform:scale(.985)}
.mod .no{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px}
.mod .m-main{flex:1;min-width:0}
.mod .m-name{font-weight:600;font-size:16.5px}
.mod .m-desc{color:var(--sub);font-size:13px;margin-top:2px}
.mod.locked{opacity:.62;cursor:default}
.mod.locked .no{background:#efeae0;color:#a09688}
.mod .go{color:var(--sub);font-size:13px}

/* 选项组 */
.row{margin:14px 0}
.row .lab{font-size:13.5px;color:var(--sub);margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:96px;min-height:52px;border:1px solid var(--line);background:#fff;
  border-radius:12px;padding:11px 8px;font-size:14.5px;color:var(--ink);cursor:pointer;line-height:1.35}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.seg button .s{display:block;font-size:11.5px;opacity:.75;font-weight:400}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;min-height:52px;font-size:16.5px;
  font-weight:600;background:var(--accent);color:#fff;cursor:pointer;margin-top:18px}
.btn:active{opacity:.9}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}

/* 答题 */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:8px}
.qbar .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;
  font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap}
.bar{height:6px;background:#eae1d2;border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .25s}
.ask{font-size:13.5px;color:var(--sub);margin-bottom:10px}
.prompt{font-size:24px;line-height:1.9;letter-spacing:1px;margin:2px 0 18px;word-break:break-word}
.prompt .pm{color:var(--accent);opacity:.85}
.sk{font-size:20px;line-height:1.9;letter-spacing:0;margin:0 0 6px}
.sk .bk{display:inline-block;width:1.28em;height:1.1em;border-bottom:2px solid var(--blank);
  margin:0 4px;vertical-align:-3px}
.sk .pm{color:var(--sub)}
.sk-note{font-size:12px;color:var(--sub);margin-bottom:12px}
input.ans{width:100%;font-size:19px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);outline:none;
  font-family:"Songti SC","STSong","SimSun",serif;letter-spacing:1px}
input.ans:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,139,78,.14)}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1;border-radius:12px;padding:13px;min-height:50px;font-size:15.5px;cursor:pointer;border:1px solid var(--line);background:#fff}
.acts button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* 手机上的操作条：吸附在屏幕底部，键盘弹出时也在拇指够得到的位置 */
.actionbar{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;margin-top:auto;
  margin-left:-16px;margin-right:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(246,241,231,.72),var(--bg) 52%);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.actionbar button{flex:1 1 auto;min-height:52px;border-radius:14px;font-size:16.5px;
  border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.actionbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.actionbar button.mini{flex:0 0 auto;padding:0 14px;font-size:14px;color:var(--sub)}

/* 判分 */
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:10px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.result-box{border-radius:14px;padding:14px;border:1px solid var(--line);background:#fffdf7}
.result-box.ok{background:var(--ok-soft);border-color:#cbe3d5}
.result-box.bad{background:var(--bad-soft);border-color:#eed3ce}
.correct-line{font-size:22px;line-height:1.9;letter-spacing:1px}
.src{font-size:13.5px;color:var(--sub);margin-top:8px}
.yours{font-size:14px;color:var(--bad);margin-top:6px;text-decoration:line-through;opacity:.85}

/* 结算 */
.big{font-size:40px;font-weight:700;color:var(--accent);line-height:1.2;text-align:center}
.big small{font-size:15px;color:var(--sub);font-weight:400;display:block;margin-top:4px}
.stats{display:flex;gap:10px;margin:16px 0 0}
.stat{flex:1;text-align:center;background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:21px}
.stat span{font-size:12px;color:var(--sub)}
.wrong-item{border-top:1px dashed var(--line);padding:14px 0}
.wrong-item:first-of-type{border-top:0}
.wrong-item .wq{font-size:15px;color:var(--sub)}
.wrong-item .wa{font-size:19px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(47,42,36,.92);
  color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.foot{text-align:center;color:#a89c8b;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   数据区：每加一个模块，只需在 MODULES 里登记 + 写好该模块的渲染函数。
   DATA 段被 DATA-START / DATA-END 两个标记包住，外部脚本可截取后 JSON.parse 做校验。
   ========================================================================= */
/* DATA-START */
const DATA = [
 {"s":"非淡泊无以明志，非宁静无以致远。","t":"非淡泊無以明志，非寧靜無以致遠。","a":"诸葛亮","at":"諸葛亮","src":"《诫子书》","srct":"《誡子書》"},
 {"s":"非学无以广才，非志无以成学。","t":"非學無以廣才，非志無以成學。","a":"诸葛亮","at":"諸葛亮","src":"《诫子书》","srct":"《誡子書》"},
 {"s":"勿以恶小而为之，勿以善小而不为。","t":"勿以惡小而為之，勿以善小而不為。","a":"陈寿","at":"陳壽","src":"《三国志·蜀志》裴松之注","srct":"《三國志·蜀志》裴松之注"},
 {"s":"采菊东篱下，悠然见南山。","t":"採菊東籬下，悠然見南山。","a":"陶渊明","at":"陶淵明","src":"《饮酒》","srct":"《飲酒》"},
 {"s":"羁鸟恋旧林，池鱼思故渊。","t":"羈鳥戀舊林，池魚思故淵。","a":"陶渊明","at":"陶淵明","src":"《归园田居》","srct":"《歸園田居》"},
 {"s":"云无心以出岫，鸟倦飞而知还。","t":"雲無心以出岫，鳥倦飛而知還。","a":"陶渊明","at":"陶淵明","src":"《归去来兮辞》","srct":"《歸去來兮辭》"},
 {"s":"木欣欣以向荣，泉涓涓而始流。","t":"木欣欣以向榮，泉涓涓而始流。","a":"陶渊明","at":"陶淵明","src":"《归去来兮辞》","srct":"《歸去來兮辭》"},
 {"s":"盛年不重来，一日难再晨。","t":"盛年不重來，一日難再晨。","a":"陶渊明","at":"陶淵明","src":"《杂诗》","srct":"《雜詩》"},
 {"s":"及时当勉励，岁月不待人。","t":"及時當勉勵，歲月不待人。","a":"陶渊明","at":"陶淵明","src":"《杂诗》","srct":"《雜詩》"},
 {"s":"刑天舞干戚，猛志固常在。","t":"刑天舞干戚，猛志固常在。","a":"陶渊明","at":"陶淵明","src":"《读山海经》","srct":"《讀山海經》"},
 {"s":"不戚戚于贫贱，不汲汲于富贵。","t":"不戚戚於貧賤，不汲汲於富貴。","a":"陶渊明","at":"陶淵明","src":"《五柳先生传》","srct":"《五柳先生傳》"},
 {"s":"池塘生春草，园柳变鸣禽。","t":"池塘生春草，園柳變鳴禽。","a":"谢灵运","at":"謝靈運","src":"《登池上楼》","srct":"《登池上樓》"},
 {"s":"宁为玉碎，不为瓦全。","t":"寧為玉碎，不為瓦全。","a":"李百药","at":"李百藥","src":"《北齐书·元景安传》","srct":"《北齊書·元景安傳》"},
 {"s":"欲人勿知，莫若勿为。","t":"欲人勿知，莫若勿為。","a":"枚乘","at":"枚乘","src":"《上书谏吴王》","srct":"《上書諫吳王》"},
 {"s":"近朱者赤，近墨者黑。","t":"近朱者赤，近墨者黑。","a":"傅玄","at":"傅玄","src":"《太子少傅箴》","srct":"《太子少傅箴》"},
 {"s":"登山则情满于山，观海则意溢于海。","t":"登山則情滿於山，觀海則意溢於海。","a":"刘勰","at":"劉勰","src":"《文心雕龙·神思》","srct":"《文心雕龍·神思》"},
 {"s":"操千曲而后晓声，观千剑而后识器。","t":"操千曲而後曉聲，觀千劍而後識器。","a":"刘勰","at":"劉勰","src":"《文心雕龙·知音》","srct":"《文心雕龍·知音》"},
 {"s":"余霞散成绮，澄江静如练。","t":"餘霞散成綺，澄江靜如練。","a":"谢朓","at":"謝朓","src":"《晚登三山还望京邑》","srct":"《晚登三山還望京邑》"},
 {"s":"蝉噪林逾静，鸟鸣山更幽。","t":"蟬噪林逾靜，鳥鳴山更幽。","a":"王籍","at":"王籍","src":"《入若耶溪》","srct":"《入若耶溪》"},
 {"s":"疾风知劲草，板荡识诚臣。","t":"疾風知勁草，板蕩識誠臣。","a":"李世民","at":"李世民","src":"《赐萧瑀》","srct":"《賜蕭瑀》"},
 {"s":"海内存知己，天涯若比邻。","t":"海內存知己，天涯若比鄰。","a":"王勃","at":"王勃","src":"《送杜少府之任蜀州》","srct":"《送杜少府之任蜀州》"},
 {"s":"落霞与孤鹜齐飞，秋水共长天一色。","t":"落霞與孤鶩齊飛，秋水共長天一色。","a":"王勃","at":"王勃","src":"《滕王阁序》","srct":"《滕王閣序》"},
 {"s":"冯唐易老，李广难封。","t":"馮唐易老，李廣難封。","a":"王勃","at":"王勃","src":"《滕王阁序》","srct":"《滕王閣序》"},
 {"s":"念天地之悠悠，独怆然而涕下。","t":"念天地之悠悠，獨愴然而涕下。","a":"陈子昂","at":"陳子昂","src":"《登幽州台歌》","srct":"《登幽州臺歌》"},
 {"s":"春江潮水连海平，海上明月共潮生。","t":"春江潮水連海平，海上明月共潮生。","a":"张若虚","at":"張若虛","src":"《春江花月夜》","srct":"《春江花月夜》"},
 {"s":"江畔何人初见月？江月何年初照人？","t":"江畔何人初見月？江月何年初照人？","a":"张若虚","at":"張若虛","src":"《春江花月夜》","srct":"《春江花月夜》"},
 {"s":"年年岁岁花相似，岁岁年年人不同。","t":"年年歲歲花相似，歲歲年年人不同。","a":"刘希夷","at":"劉希夷","src":"《代悲白头翁》","srct":"《代悲白頭翁》"},
 {"s":"海上生明月，天涯共此时。","t":"海上生明月，天涯共此時。","a":"张九龄","at":"張九齡","src":"《望月怀远》","srct":"《望月懷遠》"},
 {"s":"思君如满月，夜夜减清辉。","t":"思君如滿月，夜夜減清輝。","a":"张九龄","at":"張九齡","src":"《赋得自君之出矣》","srct":"《賦得自君之出矣》"},
 {"s":"野旷天低树，江清月近人。","t":"野曠天低樹，江清月近人。","a":"孟浩然","at":"孟浩然","src":"《宿建德江》","srct":"《宿建德江》"}
];
/* DATA-END */

/* 繁体 → 简体 归一化表（判分时把繁、简、混写都折算成简体再比较）。
   表内只收录本模块句子出现过的字；新增句子时若含新繁体字，请补进此表。 */
const T2S = {
 "無":"无","寧":"宁","靜":"静","遠":"远","學":"学","廣":"广","惡":"恶","為":"为","陳":"陈",
 "雲":"云","飛":"飞","還":"还",
 "壽":"寿","國":"国","採":"采","東":"东","籬":"篱","見":"见","羈":"羁","鳥":"鸟","戀":"恋",
 "舊":"旧","魚":"鱼","淵":"渊","歸":"归","來":"来","辭":"辞","榮":"荣","難":"难","時":"时",
 "當":"当","勵":"励","歲":"岁","雜":"杂","讀":"读","經":"经","於":"于","貧":"贫","賤":"贱",
 "貴":"贵","傳":"传","園":"园","變":"变","鳴":"鸣","謝":"谢","靈":"灵","運":"运","樓":"楼",
 "藥":"药","齊":"齐","書":"书","諫":"谏","吳":"吴","則":"则","滿":"满","觀":"观","劉":"刘",
 "龍":"龙","後":"后","曉":"晓","聲":"声","劍":"剑","識":"识","餘":"余","綺":"绮","練":"练",
 "蟬":"蝉","風":"风","勁":"劲","蕩":"荡","誠":"诚","賜":"赐","蕭":"萧","鄰":"邻","與":"与",
 "鶩":"鹜","長":"长","閣":"阁","馮":"冯","張":"张","獨":"独","愴":"怆","臺":"台","連":"连",
 "齡":"龄","懷":"怀","減":"减","輝":"辉","賦":"赋","曠":"旷","樹":"树","頭":"头","誡":"诫",
 "內":"内"
};

/* 模块清单：以后加「第二部分」「第三部分」时，把 ready 改成 true 并补上渲染函数即可 */
const MODULES = [
  {id:'mingju', no:'一', name:'名句默写', desc:'三十句古代诗词名句 · 前半/后半互默', ready:true},
  {id:'p2', no:'二', name:'（第二部分）', desc:'待补充内容，告诉我考什么即可接入', ready:false},
  {id:'p3', no:'三', name:'（第三部分）', desc:'待补充内容', ready:false}
];

const SEP_RE = /[，,；;：:？?！!]/;      // 用于把整句切成上下两半
const HAN_RE = /[\u3400-\u9fff\uf900-\ufaff]/;
const TOTAL = DATA.length;

const state = {
  view:'home', mode:'hs', script:'s', shuffle:true,
  queue:[], idx:0, results:[], answered:false, correct:false, userInput:''
};

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* 判分归一化：只留汉字，繁体折算成简体 */
function norm(str){
  let out = '';
  for(const ch of String(str||'')){
    if(HAN_RE.test(ch)) out += (T2S[ch] || ch);
  }
  return out;
}
function saveSettings(){
  try{ localStorage.setItem('cnExamCfg', JSON.stringify({mode:state.mode, script:state.script, shuffle:state.shuffle})); }catch(e){}
}
function loadSettings(){
  try{
    const c = JSON.parse(localStorage.getItem('cnExamCfg')||'{}');
    if(c.mode) state.mode = c.mode;
    if(c.script) state.script = c.script;
    if(typeof c.shuffle === 'boolean') state.shuffle = c.shuffle;
  }catch(e){}
}
/* 把整句拆成上/下半句（标点随所属的一半） */
function splitItem(item){
  const full = item[state.script === 't' ? 't' : 's'];
  const m = full.match(SEP_RE);
  const i = m ? m.index : Math.floor(full.length/2);
  const sep = m ? m[0] : '';
  return {full, first: full.slice(0,i), sep, second: full.slice(i + sep.length)};
}
/* 生成带标点的题目信息 */
function buildQuestion(item){
  const p = splitItem(item);
  const askSecond = state.mode === 'hs';            // 给上半句，默下半句
  const prompt = askSecond ? (p.first + p.sep) : p.second;
  const answerDisp = askSecond ? p.second : (p.first + p.sep);   // 标点已给出，用户只写汉字
  const answerKey = askSecond ? p.second : p.first;
  return {
    prompt, answerDisp, answerKey,
    answerChars: norm(answerKey),
    author: state.script === 't' ? item.at : item.a,
    src: state.script === 't' ? item.srct : item.src,
    full: p.full
  };
}
/* 标点骨架：汉字位置画空栏，标点原样显示 */
function skeleton(str){
  let h = '';
  for(const ch of String(str)){
    if(HAN_RE.test(ch)) h += '<i class="bk"></i>';
    else h += '<i class="pm">' + esc(ch) + '</i>';
  }
  return h;
}
/* 题干着色：标点用强调色 */
function paint(str){
  let h = '';
  for(const ch of String(str)){
    h += HAN_RE.test(ch) ? esc(ch) : '<span class="pm">' + esc(ch) + '</span>';
  }
  return h;
}

/* ---------- 首页 ---------- */
function renderHome(){
  state.view = 'home';
  const mods = MODULES.map(m => `
    <div class="mod ${m.ready?'':'locked'}" data-id="${m.id}" data-ready="${m.ready?1:0}">
      <div class="no">${m.no}</div>
      <div class="m-main">
        <div class="m-name">${esc(m.name)}</div>
        <div class="m-desc">${esc(m.desc)}</div>
      </div>
      <div class="go">${m.ready ? '开始 ›' : '待添加'}</div>
    </div>`).join('');

  $('app').innerHTML = `
    <div class="top"><div class="title han">中文考试练习<small>在线默写 · 自动判分 · 繁简皆可</small></div></div>
    ${mods}
    <div class="card" style="padding:14px 16px">
      <p class="desc" style="font-size:12.5px;line-height:1.75">
        手机使用：在浏览器打开本页后，点「分享 / 菜单」→「添加到主屏幕」，即可全屏使用，像小程序一样，断网也能做。<br>
        分享给同学：把这个网址发给他们即可，不需要和你连同一个网络。<br>
        已收录 ${TOTAL} 条名句 · 自动判分 · 繁简皆可
      </p>
    </div>`;

  $('app').querySelectorAll('.mod').forEach(node => {
    node.onclick = () => {
      if(node.dataset.ready === '1') renderSetup();
      else toast('该模块内容待补充，告诉我考什么就能加进来');
    };
  });
}

/* ---------- 练习设置 ---------- */
function renderSetup(){
  state.view = 'setup';
  const S = (v,k) => state[k] === v ? 'on' : '';
  $('app').innerHTML = `
    <div class="top">
      <button class="back" id="bk">‹ 返回</button>
      <div class="title">第一部分 · 名句默写</div>
    </div>
    <div class="card">
      <h2>选择模式</h2>
      <p class="desc">标点符号由小程序给出，你只需默写出汉字。</p>
      <div class="row">
        <div class="lab">默写方向</div>
        <div class="seg" id="segMode">
          <button class="${S('hs','mode')}" data-v="hs">给上半句 · 默下半句<span class="s">例：非淡泊无以明志，＿＿</span></button>
          <button class="${S('sh','mode')}" data-v="sh">给下半句 · 默上半句<span class="s">例：＿＿，非宁静无以致远</span></button>
        </div>
      </div>
      <div class="row">
        <div class="lab">显示字形</div>
        <div class="seg" id="segScript">
          <button class="${S('s','script')}" data-v="s">简体</button>
          <button class="${S('t','script')}" data-v="t">繁體</button>
        </div>
      </div>
      <div class="row">
        <div class="lab">题目顺序</div>
        <div class="seg" id="segShuffle">
          <button class="${S(true,'shuffle')}" data-v="1">乱序（打乱）</button>
          <button class="${S(false,'shuffle')}" data-v="0">原顺序</button>
        </div>
      </div>
      <button class="btn" id="start">开始练习（${TOTAL} 题）</button>
    </div>
    <div class="foot">作者与出处会在每题作答后直接显示</div>`;

  $('bk').onclick = renderHome;
  const bindSeg = (id, key, parse) => {
    $(id).querySelectorAll('button').forEach(b => b.onclick = () => {
      state[key] = parse(b.dataset.v); saveSettings(); renderSetup();
    });
  };
  bindSeg('segMode','mode', v => v);
  bindSeg('segScript','script', v => v);
  bindSeg('segShuffle','shuffle', v => v === '1');
  $('start').onclick = () => startQuiz();
}

/* ---------- 开始 / 出题 ---------- */
function startQuiz(pool){
  const items = (pool || DATA).slice();
  state.queue = state.shuffle ? shuffleArr(items) : items;
  state.idx = 0; state.results = []; state.answered = false;
  renderQuiz();
}
/* 只打乱尚未作答的部分，不打乱当前这道（避免答到一半题目被换掉），也不影响已答记录 */
function reshuffle(){
  const from = state.answered ? state.idx + 1 : state.idx;
  state.queue = state.queue.slice(0, from).concat(shuffleArr(state.queue.slice(from)));
  renderQuiz();
  toast(state.answered ? '剩余题目已重新打乱' : '已重新打乱顺序');
}
function advance(){
  if(state.idx + 1 >= state.queue.length){ renderResult(); return; }
  state.idx++; state.answered = false; state.userInput = ''; renderQuiz();
  setTimeout(()=>{ const i = $('ans'); if(i) i.focus(); }, 30);
}
function submit(giveUp){
  const q = buildQuestion(state.queue[state.idx]);
  const input = $('ans');
  const raw = giveUp ? '' : (input ? input.value : '');
  if(!giveUp && !raw.trim()){ toast('请先写下你的答案'); if(input) input.focus(); return; }
  state.userInput = raw.trim();
  state.correct = norm(raw) === q.answerChars;
  state.answered = true;
  state.results.push({item: state.queue[state.idx], q, userInput: state.userInput, correct: state.correct});
  saveSettings();
  renderQuiz();
}

/* ---------- 答题界面 ---------- */
function renderQuiz(){
  state.view = 'quiz';
  const item = state.queue[state.idx];
  const q = buildQuestion(state.queue[state.idx]);
  const done = state.results.filter(r => r.correct).length;
  const wrongN = state.results.length - done;
  const no = state.idx + 1, total = state.queue.length;

  let answerArea, actionBar;
  if(!state.answered){
    answerArea = `
      <div class="sk han">${skeleton(q.answerDisp)}</div>
      <div class="sk-note">标点已给出，共需默写 <b>${q.answerChars.length}</b> 个汉字（繁体、简体都可以）</div>
      <input class="ans" id="ans" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="done"
             placeholder="在此输入汉字，不用打标点" />`;
    actionBar = `
      <div class="actionbar">
        <button class="mini" id="skip">看答案</button>
        <button class="primary" id="ok">提交</button>
      </div>`;
  }else{
    const okCls = state.correct ? 'ok' : 'bad';
    answerArea = `
      <div class="verdict ${okCls}">${state.correct ? '✅ 默写正确' : '❌ 默写有误'}</div>
      <div class="result-box ${okCls}">
        <div class="correct-line han">${paint(q.full)}</div>
        <div class="src">—— ${esc(q.author)}${esc(q.src)}</div>
        ${state.correct ? '' : `<div class="yours">你写的是：${state.userInput ? esc(state.userInput) : '（未作答）'}</div>`}
      </div>`;
    actionBar = `
      <div class="actionbar">
        <button class="primary" id="next">${no < total ? '下一题 ›' : '查看成绩 ›'}</button>
      </div>`;
  }

  $('app').innerHTML = `
    <div class="top">
      <button class="back" id="bk">‹ 首页</button>
      <div class="title">名句默写 · ${state.mode === 'hs' ? '默下半句' : '默上半句'}${state.script === 't' ? ' · 繁體' : ''}</div>
    </div>
    <div class="qbar">
      <span>第 ${no} / ${total} 题</span>
      <span>✓ ${done} · ✗ ${wrongN}</span>
      <button class="mini" id="re">重新打乱</button>
    </div>
    <div class="bar"><i style="width:${(state.idx / total * 100).toFixed(1)}%"></i></div>
    <div class="card">
      <div class="ask">${state.mode === 'hs' ? '请默写【下半句】：' : '请默写【上半句】：'}</div>
      <div class="prompt han">${paint(q.prompt)}</div>
      ${answerArea}
    </div>
    ${actionBar}`;

  $('bk').onclick = renderHome;
  $('re').onclick = reshuffle;
  if(!state.answered){
    const inp = $('ans');
    inp.focus();
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); submit(false); }
    });
    $('ok').onclick = () => submit(false);
    $('skip').onclick = () => submit(true);
  }else{
    $('next').onclick = advance;
  }
}

/* ---------- 成绩单 ---------- */
function renderResult(){
  state.view = 'result';
  const wrongs = state.results.filter(r => !r.correct);
  const right = state.results.length - wrongs.length;
  const total = state.results.length;
  const rate = total ? Math.round(right / total * 100) : 0;
  const wrongHtml = wrongs.length ? wrongs.map(r => `
      <div class="wrong-item">
        <div class="wq">题干：${paint(r.q.prompt)}　｜　你的答案：${r.userInput ? esc(r.userInput) : '（跳过）'}</div>
        <div class="wa han">${paint(r.q.full)}</div>
        <div class="src">—— ${esc(r.q.author)}${esc(r.q.src)}</div>
      </div>`).join('') : '<p class="desc">全部答对，太厉害了！</p>';

  $('app').innerHTML = `
    <div class="top"><button class="back" id="bk">‹ 首页</button><div class="title">本轮成绩</div></div>
    <div class="card">
      <div class="big">${rate}%<small>正确率</small></div>
      <div class="stats">
        <div class="stat"><b style="color:var(--ok)">${right}</b><span>答对</span></div>
        <div class="stat"><b style="color:var(--bad)">${wrongs.length}</b><span>答错</span></div>
        <div class="stat"><b>${total}</b><span>总题数</span></div>
      </div>
      <button class="btn" id="again">再来一轮（重新打乱）</button>
      ${wrongs.length ? '<button class="btn ghost" id="retry" style="margin-top:10px">只练错题</button>' : ''}
    </div>
    <div class="card">
      <h2>错题回顾</h2>
      ${wrongHtml}
    </div>`;

  $('bk').onclick = renderHome;
  $('again').onclick = () => startQuiz();
  if($('retry')) $('retry').onclick = () => startQuiz(wrongs.map(w => w.item));
}

/* ---------- 启动 ---------- */
loadSettings();
renderHome();
</script>
</body>
</html>
